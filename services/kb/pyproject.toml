[project]
name = "kb"
version = "0.1.0"
description = "PoC: base de conocimientos real (ingesta de fuentes oficiales y búsqueda con citas)"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
