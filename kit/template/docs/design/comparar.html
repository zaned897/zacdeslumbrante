<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comparar propuesta</title>
<style>
:root{--bg:#F7F4EE;--fg:#1C1917;--muted:#57534E;--line:#E2D9CB;--accent:#9A3412;--paper:#FBF9F5}
@media (prefers-color-scheme:dark){:root{--bg:#171310;--fg:#F2ECE1;--muted:#B8AFA4;--line:#3A312A;--accent:#F0926A;--paper:#1F1A16;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;height:100vh}
header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--paper)}
header b{font-size:16px}
form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);width:7em}
input#ruta{width:14em}
button,.tab{font:inherit;font-weight:600;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:5px 12px;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--bg)}
.tabs{display:none;gap:6px}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
section{display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--line)}
section h2{margin:0;padding:6px 12px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
section h2 a{color:var(--accent);text-transform:none;letter-spacing:0}
iframe{flex:1;border:0;width:100%;background:#fff}
.hint{font-size:13px;color:var(--muted)}
@media (max-width:820px){main{grid-template-columns:1fr}.tabs{display:flex}section[hidden]{display:none}}
</style>
</head>
<body>
<header>
  <b>Antes y después</b>
  <form id="f">
    <label>PR <input id="pr" inputmode="numeric" placeholder="96"></label>
    <label>Página <input id="ruta" placeholder="adelanto/index.html"></label>
    <label>Sección <input id="ancla" placeholder="propuesta-a"></label>
    <button type="submit">Ver</button>
  </form>
  <div class="tabs" role="group" aria-label="Versión">
    <button class="tab" type="button" data-v="antes" aria-pressed="true">Antes</button>
    <button class="tab" type="button" data-v="despues" aria-pressed="false">Después</button>
  </div>
  <span class="hint" id="hint"></span>
</header>
<main>
  <section id="antes"><h2>Antes · main <a id="la" target="_blank" rel="noopener">abrir</a></h2><iframe id="fa" title="Versión en main"></iframe></section>
  <section id="despues"><h2>Después · PR <a id="ld" target="_blank" rel="noopener">abrir</a></h2><iframe id="fd" title="Versión del PR"></iframe></section>
</main>
<script>
// PROTO: Render nombra las previews <servicio>-pr-<n>.onrender.com; si cambia, pasa ?despues=<url base>.
var SITIO = location.origin.indexOf('onrender.com') > -1 ? 'https://{{SITIO_DISEÑO}}.onrender.com' : location.origin;
var q = new URLSearchParams(location.search);
var el = function (id) { return document.getElementById(id); };
el('pr').value = q.get('pr') || '';
el('ruta').value = q.get('ruta') || 'adelanto/index.html';
el('ancla').value = (location.hash || '').slice(1);
function cargar() {
  var pr = el('pr').value.trim(), ruta = el('ruta').value.trim().replace(/^\/+/, '') || 'adelanto/index.html';
  var ancla = el('ancla').value.trim(), h = ancla ? '#' + encodeURIComponent(ancla) : '';
  var antes = SITIO + '/' + ruta + h;
  el('fa').src = antes; el('la').href = antes;
  if (/^\d+$/.test(pr)) {
    var base = q.get('despues') || 'https://{{SITIO_DISEÑO}}-pr-' + pr + '.onrender.com';
    var despues = base.replace(/\/+$/, '') + '/' + ruta + h;
    el('fd').src = despues; el('ld').href = despues;
    el('hint').textContent = 'Si la preview tarda, Render la está construyendo (1–2 min).';
  } else {
    el('fd').removeAttribute('src'); el('hint').textContent = 'Escribe el número del PR.';
  }
}
el('f').addEventListener('submit', function (e) {
  e.preventDefault();
  var p = new URLSearchParams({ pr: el('pr').value.trim(), ruta: el('ruta').value.trim() });
  history.replaceState(null, '', '?' + p + (el('ancla').value ? '#' + el('ancla').value.trim() : ''));
  cargar();
});
document.querySelectorAll('.tab').forEach(function (b) {
  b.addEventListener('click', function () {
    document.querySelectorAll('.tab').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
    el('antes').hidden = b.dataset.v !== 'antes'; el('despues').hidden = b.dataset.v !== 'despues';
  });
});
if (matchMedia('(max-width:820px)').matches) el('despues').hidden = true;
cargar();
</script>
</body>
</html>
