# Mueve las tarjetas del tablero (GitHub Projects) según las etiquetas status:* y los PRs.
# Tablero: https://github.com/users/zaned897/projects/2
# Necesita el secreto PROJECT_TOKEN (token clásico con permisos `project` y `repo`).
# Las automatizaciones integradas del tablero agregan los elementos y los pasan a "Done" al cerrar.
name: tablero

on:
  issues:
    types: [labeled, unlabeled, reopened]
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft]

permissions: {}

concurrency:
  group: tablero-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  mover:
    runs-on: ubuntu-latest
    steps:
      - name: Sin token no hace nada
        id: token
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$PROJECT_TOKEN" ]; then
            echo "::notice::Falta el secreto PROJECT_TOKEN; el tablero no se actualiza."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mover tarjeta
        if: steps.token.outputs.ok == 'true'
        uses: actions/github-script@v7
        env:
          PROJECT_OWNER: zaned897
          PROJECT_NUMBER: '2'
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            // Cada estado lista nombres de columna aceptados, en orden de preferencia.
            // Si el tablero no tiene ninguno, la tarjeta no se mueve (queda en el log).
            const COLUMNAS = {
              idea: ['Idea', 'Todo'],
              diseno: ['Diseño', 'Diseno', 'Design', 'Todo'],
              listo: ['Listo', 'Ready', 'Todo'],
              enCurso: ['En curso', 'In Progress', 'In progress'],
              revision: ['Revisión', 'Revision', 'Review'],
            };
            // Etiqueta → estado. La primera que aparezca en este orden gana.
            const ETIQUETAS = [
              ['status:ready', 'listo'],
              ['status:design', 'diseno'],
              ['status:triage', 'idea'],
              ['status:stale', 'idea'],
            ];

            const ev = context.payload;
            let contentId, estado;

            if (context.eventName === 'pull_request_target') {
              contentId = ev.pull_request.node_id;
              estado = ev.pull_request.draft ? 'enCurso' : 'revision';
            } else {
              if (ev.issue.state !== 'open') return core.info('Issue cerrada: la mueve el tablero.');
              contentId = ev.issue.node_id;
              const nombres = ev.issue.labels.map((l) => l.name);
              const hit = ETIQUETAS.find(([etiqueta]) => nombres.includes(etiqueta));
              estado = hit ? hit[1] : 'idea';
            }

            const { user } = await github.graphql(
              `query($login: String!, $number: Int!) {
                user(login: $login) {
                  projectV2(number: $number) {
                    id
                    field(name: "Status") {
                      ... on ProjectV2SingleSelectField { id options { id name } }
                    }
                  }
                }
              }`,
              { login: process.env.PROJECT_OWNER, number: Number(process.env.PROJECT_NUMBER) },
            );
            const project = user.projectV2;
            const field = project.field;
            if (!field) return core.warning('El tablero no tiene el campo Status.');

            const opcion = COLUMNAS[estado]
              .map((n) => field.options.find((o) => o.name.toLowerCase() === n.toLowerCase()))
              .find(Boolean);
            if (!opcion) {
              return core.warning(`Sin columna para "${estado}". Columnas: ${field.options.map((o) => o.name).join(', ')}`);
            }

            // Agregar es idempotente: si ya está en el tablero devuelve el mismo elemento.
            const { addProjectV2ItemById } = await github.graphql(
              `mutation($project: ID!, $content: ID!) {
                addProjectV2ItemById(input: { projectId: $project, contentId: $content }) { item { id } }
              }`,
              { project: project.id, content: contentId },
            );

            await github.graphql(
              `mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $project, itemId: $item, fieldId: $field,
                  value: { singleSelectOptionId: $option }
                }) { projectV2Item { id } }
              }`,
              { project: project.id, item: addProjectV2ItemById.item.id, field: field.id, option: opcion.id },
            );
            core.info(`Movida a "${opcion.name}" (${estado}).`);
