# Publica en el PR las capturas antes/después y los enlaces de preview (#96).
# Corre aparte, con permisos de escritura, sin ejecutar código del PR: solo lee las imágenes que dejó diseno-capturas.yml.
name: Diseño · comentario
on:
  workflow_run:
    workflows: ['Diseño · capturas']
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read

env:
  SITIO: https://zacdes-diseno.onrender.com          # main = «antes»
  PREVIEW: https://zacdes-diseno-pr-{n}.onrender.com # preview del PR = «después» (Render)
  RAMA_IMAGENES: design-previews

jobs:
  comentar:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: capturas-diseno
          path: capturas
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validar datos
        id: pr
        run: |
          PR=$(jq -r '.pr' capturas/pr.json); SHA=$(jq -r '.sha' capturas/pr.json)
          [[ "$PR" =~ ^[0-9]+$ && "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "datos inválidos"; exit 1; }
          echo "n=$PR" >> "$GITHUB_OUTPUT"; echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Subir imágenes a la rama de capturas
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          N=${{ steps.pr.outputs.n }}; SHA=${{ steps.pr.outputs.sha }}
          ls capturas/*.jpg >/dev/null 2>&1 || exit 0
          git init -q img && cd img
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}.git"
          if git fetch -q --depth 1 origin "$RAMA_IMAGENES"; then git checkout -q -b "$RAMA_IMAGENES" FETCH_HEAD; else git checkout -q --orphan "$RAMA_IMAGENES"; fi
          rm -rf "pr-$N"; mkdir -p "pr-$N/${SHA:0:7}"
          find ../capturas -maxdepth 1 -name '*.jpg' -exec cp {} "pr-$N/${SHA:0:7}/" \;
          git add -A && git commit -qm "capturas de diseño PR #$N (${SHA:0:7})" && git push -q origin "HEAD:$RAMA_IMAGENES"
      - name: Comentar en el PR
        uses: actions/github-script@v7
        env:
          N: ${{ steps.pr.outputs.n }}
          SHA: ${{ steps.pr.outputs.sha }}
        with:
          script: |
            const fs = require('fs');
            const n = Number(process.env.N), sha = process.env.SHA, short = sha.slice(0, 7);
            const list = JSON.parse(fs.readFileSync('capturas/manifest.json', 'utf8'));
            const raw = (f) => `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${process.env.RAMA_IMAGENES}/pr-${n}/${short}/${encodeURIComponent(f)}`;
            const preview = process.env.PREVIEW.replace('{n}', n);
            const esc = (s) => String(s).replace(/[<>|`]/g, '');
            const rows = list.map((e) => {
              const where = esc(e.file) + (e.section ? ` · ${esc(e.section)}` : '');
              const anchor = e.anchor ? `#${encodeURIComponent(e.anchor)}` : '';
              const cmp = `${process.env.SITIO}/comparar.html?pr=${n}&ruta=${encodeURIComponent(e.file)}${anchor}`;
              const img = (f) => (f ? `<img src="${raw(f)}" width="380">` : '—');
              return `| **${where}**<br>${esc(e.status)} · [comparar](${cmp}) | ${img(e.before)} | ${img(e.after)} |`;
            });
            const body = [
              '<!-- diseno-capturas -->',
              `### Visuales de este PR · \`${short}\``,
              `Navegar: [antes (main)](${process.env.SITIO}/adelanto/) · [después (este PR)](${preview}/adelanto/) · [lado a lado](${process.env.SITIO}/comparar.html?pr=${n})`,
              '',
              rows.length ? '| Qué cambia | Antes | Después |\n|---|---|---|\n' + rows.join('\n') : '_No hay HTML que cambie en `docs/design/`._',
              '',
              'Decisión del dueño: **Approve + merge** = aprobado (se crean las issues y se comentan aquí) · **Request changes** = ajustar en esta rama · **Cerrar** = rechazado.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: n, per_page: 100 });
            const mine = comments.find((c) => c.user.type === 'Bot' && c.body.includes('<!-- diseno-capturas -->'));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: n, body });
